server:
  port: 2333
  address: 127.0.0.1 # Securely bound to localhost by default
  http2:
    enabled: false

lavalink:
  plugins:
    # YouTube plugin for Lavalink v4 (dev.lavalink.youtube)
    - dependency: "dev.lavalink.youtube:youtube-plugin:2be8e542d3f6f178e048dca565892684c2e40177"
      repository: "https://maven.lavalink.dev/snapshots"
    # LavaSrc plugin for Spotify / Apple Music / Deezer metadata matching
    - dependency: "com.github.topi314.lavasrc:lavasrc-plugin:4.3.0"
      repository: "https://maven.lavalink.dev/releases"

  server:
    password: "youshallnotpass"
    sources:
      youtube: false # Handled by the youtube-plugin above in Lavalink v4
      bandcamp: true
      soundcloud: true
      twitch: true
      vimeo: false
      http: true
      local: false
    filters:
      volume: true
      equalizer: true
      karaoke: false
      timescale: true
      tremolo: false
      vibrato: false
      distortion: false
      rotation: false
      channelMix: true
      lowPass: true
    bufferDurationMs: 400
    frameBufferDurationMs: 5000
    opusEncodingQuality: 10
    resamplingQuality: HIGH
    trackStuckThresholdMs: 10000
    useSeekGhosting: true
    playerUpdateInterval: 5
    youtubeSearchEnabled: true
    soundcloudSearchEnabled: true
    gc-warnings: true

plugins:
  youtube:
    enabled: true
    allowSearch: true
    allowDirectVideoIds: true
    allowDirectPlaylistIds: true
    oauth:
      enabled: true
      refreshToken: "${YOUTUBE_OAUTH_REFRESH_TOKEN:}"
      skipInitialization: true
    # Clients to use for playback and search: TV (OAuth authenticated), WEB, MUSIC, ANDROID_VR, TVHTML5_SIMPLY
    clients:
      - TV
      - ANDROID_VR
      - MUSIC
      - ANDROID_MUSIC
      - WEB
      - TVHTML5_SIMPLY
      - MWEB
      - WEBEMBEDDED

  lavasrc:
    providers:
      - "ytsearch:\"%ISRC%\""
      - "ytsearch:%QUERY%"
      - "scsearch:%QUERY%"
    sources:
      spotify: true
      applemusic: false # Disabled: requires valid Apple Music developer mediaAPIToken
      deezer: false
      yandexmusic: false
    spotify:
      clientId: "${SPOTIFY_CLIENT_ID:}" # Optional: Add Spotify Client ID for LavaSrc native resolution
      clientSecret: "${SPOTIFY_CLIENT_SECRET:}" # Optional: Add Spotify Client Secret
      countryCode: "US"
      playlistLoadLimit: 6
      albumLoadLimit: 6
    applemusic:
      countryCode: "US"
      mediaAPIToken: "${APPLE_MUSIC_MEDIA_API_TOKEN:}" # Required if applemusic source is enabled above

metrics:
  prometheus:
    enabled: false
    endpoint: /metrics

sentry:
  dsn: ""
  environment: ""

logging:
  file:
    path: ./logs/lavalink.log
  level:
    root: INFO
    lavalink: INFO

  request:
    enabled: true
    includeClientInfo: true
    includeHeaders: false
    includeQueryString: true
    includePayload: false
    maxPayloadLength: 10000

  logback:
    rollingpolicy:
      max-file-size: 10MB
      max-history: 7
